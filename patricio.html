const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K="fdt_llave_"+D.sal;
async function llave(clave){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(D.sal),iterations:D.it},base,256));
}
async function abrir(bits){
  const k=await crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},k,b64(D.ct)));
  document.open();document.write(html);document.close();
}
function guardada(){try{const v=localStorage.getItem(K)||sessionStorage.getItem(K);return v?b64(v):null}catch(e){return null}}
function guardar(bits,rec){const v=btoa(String.fromCharCode(...bits));try{(rec?localStorage:sessionStorage).setItem(K,v)}catch(e){}}
(async()=>{const g=guardada();if(g){try{await abrir(g);return}catch(e){try{localStorage.removeItem(K);sessionStorage.removeItem(K)}catch(_){}}}})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const m=document.getElementById("msg");m.textContent="Abriendo…";
  try{const bits=await llave(document.getElementById("c").value);await abrir(bits);guardar(bits,document.getElementById("r").checked)}
  catch(e){m.textContent="Clave incorrecta."}
});
