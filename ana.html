const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K="fdt_llave_"+X.sal;
async function llave(clave){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(X.sal),iterations:X.it},base,256));
}
async function descifrar(bits){
  const k=await crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(X.iv)},k,b64(X.ct)));
}
/* Reemplazar la página solo cuando terminó de cargar; si no, el dashboard queda pegado debajo del formulario. */
const cargada=new Promise(r=>{if(document.readyState==="complete")r();else window.addEventListener("load",()=>setTimeout(r,0));});
async function mostrar(html){await cargada;document.open();document.write(html);document.close();}
function guardada(){try{const v=localStorage.getItem(K)||sessionStorage.getItem(K);return v?b64(v):null}catch(e){return null}}
function guardar(bits,rec){const v=btoa(String.fromCharCode(...bits));
  try{sessionStorage.setItem(K,v)}catch(e){}
  try{if(rec)localStorage.setItem(K,v);else localStorage.removeItem(K)}catch(e){}}
function olvidar(){try{localStorage.removeItem(K);sessionStorage.removeItem(K)}catch(e){}}
const g=guardada();
if(g){descifrar(g).then(mostrar,olvidar);}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const m=document.getElementById("msg");m.textContent="Abriendo…";
  let bits,html;
  try{bits=await llave(document.getElementById("c").value);html=await descifrar(bits);}
  catch(e){m.textContent="Clave incorrecta.";return;}
  guardar(bits,document.getElementById("r").checked);
  mostrar(html);
});
})();
