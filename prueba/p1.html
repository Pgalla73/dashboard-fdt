<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Flor de Té · Dashboard</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#2b2a28;--mu:#6b675f;--ac:#5b7a4a;--er:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--card:#262522;--tx:#ece8e1;--mu:#a29d94;--ac:#8fb27a;--er:#e0786a}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);
font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
form{background:var(--card);padding:28px 24px;border-radius:14px;width:100%;max-width:360px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 18px;color:var(--mu);font-size:14px}
input[type=password]{width:100%;padding:11px 12px;font-size:16px;border:1px solid #ccc;border-radius:8px;background:transparent;color:var(--tx)}
label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:14px;color:var(--mu)}
button{width:100%;padding:11px;font-size:16px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}
#msg{color:var(--er);font-size:14px;min-height:20px;margin-top:10px}
</style></head><body>
<form id="f" autocomplete="off">
<h1>Flor de Té · Dashboard</h1>
<p>Escribe la clave para ver el dashboard.</p>
<input id="c" type="password" placeholder="Clave" autofocus>
<label><input id="r" type="checkbox" checked> Recordar en este equipo</label>
<button type="submit">Entrar</button>
<div id="msg"></div>
</form>
<script>
/* Todo dentro de una función: el dashboard que se abre usa sus propias variables globales (ej. D). */
(function(){
const X={"sal": "zGx5qwEg+ETrxq1XAAgZkQ==", "it": 600000, "iv": "VSXqGr8TBCkIJZgV", "ct": "159++RnqU/1QnUfGg8DgB8wcUGzwwwuLEfzPCkGIIy35Wyy3e8Kz/fTm0ZfHh8z8nehQ5ye5AH2IAFwjMfSfHHQJGsk5s2/xVhnnb2xKgBvrlMKPbzSzBp8BefvPc06vkIfz/bLYHGCI0UJZWcg/uU57TXVHeLj0HB/Ya4KAFM8hzU8Mw5yjey7BCTuDFBFVRZwC4J+kRcxia8FLqNMi7mASvwhc79wLss4nMCW0TBlZQEqtzbY5fqpY3WCPbvAZ3Uva5c2Xv7tFdvf4VR4PWATSEj8xXt1WtI17BOOSW6MKGb8zVrwOF9LjWhOVPb+8ygblBCp4MEaLMrORdFL3bdGKHjj4x3YqXmmxpzNiSUGqkgqu9b6+8ouTF3OCshFZtOJud+qEhiUOreIqC9U2ka2SmVd47R5z8JZQ7r+GuK2Nyod7xOL7h6TnoNRV1N1O/3rcyDyTKg=="};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K="fdt_llave_"+X.sal;
async function llave(clave){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(X.sal),iterations:X.it},base,256));
}
async function descifrar(bits){
  const k=await crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(X.iv)},k,b64(X.ct)));
}
function mostrar(html){document.open();document.write(html);document.close();}
function guardada(){try{const v=localStorage.getItem(K)||sessionStorage.getItem(K);return v?b64(v):null}catch(e){return null}}
function guardar(bits,rec){const v=btoa(String.fromCharCode(...bits));
  try{sessionStorage.setItem(K,v)}catch(e){}
  try{if(rec)localStorage.setItem(K,v);else localStorage.removeItem(K)}catch(e){}}
function olvidar(){try{localStorage.removeItem(K);sessionStorage.removeItem(K)}catch(e){}}
const g=guardada();
if(g){descifrar(g).then(mostrar,olvidar);}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const m=document.getElementById("msg");m.textContent="Abriendo…";
  let bits,html;
  try{bits=await llave(document.getElementById("c").value);html=await descifrar(bits);}
  catch(e){m.textContent="Clave incorrecta.";return;}
  guardar(bits,document.getElementById("r").checked);
  mostrar(html);
});
})();
</script></body></html>
